name: CI

# 规格依据：DESIGN §6 L4 —— 无 GPU runner：编译 + L1/L2 + LUT 一致性校验；GPU 渲染永不进 CI
#
# 说明：
#   - 使用与开发机**同一版本**的 LLVM-MinGW 压缩包（§9.1「CI 同源」），禁止本地新版、CI 旧版
#   - L1（CPU 参考实现）与 L2（doctest）都在 CPU 上运行，可在 CI 覆盖
#   - L3（目标机冒烟、PFM 差分）依赖 GPU，**刻意不进 CI**（DESIGN §6 明确的边界）

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LLVM_MINGW_TAG: "20260908"
  LLVM_MINGW_ASSET: "llvm-mingw-20260908-ucrt-x86_64.zip"

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Ninja
        run: choco install ninja --no-progress -y

      - name: 下载并解压 LLVM-MinGW（与开发机同版本）
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_TAG/$env:LLVM_MINGW_ASSET"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          7z x llvm-mingw.zip -o"C:\tools" -y | Out-Null
          Get-ChildItem "C:\tools" | Select-Object Name
          Test-Path "C:\tools\llvm-mingw\bin\clang++.exe"

      - name: 配置（Ninja + LLVM-MinGW 工具链）
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw-toolchain.cmake `
            -DEHE_LLVM_MINGW_ROOT=C:/tools/llvm-mingw `
            -DCMAKE_MAKE_PROGRAM=ninja

      - name: 构建
        shell: pwsh
        run: cmake --build build

      - name: L2 单元测试 + L1 解析基准（doctest 全量）
        shell: pwsh
        run: build/bin/ehe_tests.exe

      - name: LUT 可复现性校验（重烘焙后与仓库内两份拷贝一致）
        shell: pwsh
        run: |
          build/bin/ehe_reftool.exe lut
          git diff --exit-code -- tests/golden/blackbody_lut.f32 shaders/blackbody_lut.f32

      - name: 冒烟：GL 后端自检（CI runner 无独显，允许失败但不隐藏结果）
        shell: pwsh
        continue-on-error: true
        run: build/bin/ehe.exe --try-backends
